[project]
name = "lhas"
version = "0.1.0"
description = "LHAS (Long-Horizon Agent System) - a verifiable agent runtime / harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "pypdf>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
lhas = "lhas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lhas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
